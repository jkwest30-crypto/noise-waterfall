<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Waterfall — hear a sound, see its color</title>
    <style>
      :root { color-scheme: dark; --bg:#0e1114; --panel:#161b20; --line:#252c33;
              --text:#e6ebf0; --muted:#8e9aa6; }
      * { box-sizing: border-box; }
      body { margin:0; background:var(--bg); color:var(--text);
             font:400 14px/1.6 ui-sans-serif, system-ui, -apple-system, sans-serif; }
      #app { max-width:960px; margin:0 auto; padding:20px 20px 40px; }
      /* Aspect ratio matches the backdrop exactly, so the measured region maps
         straight onto the canvas with no letterboxing to correct for. */
      .stage { position:relative; width:100%; max-width:620px; margin:0 auto;
               aspect-ratio:1048/1588; border-radius:12px; overflow:hidden;
               border:1px solid var(--line);
               background:#0e1114 center/100% 100% no-repeat; }
      /* Transparent canvas over the photograph; the browser composites them. */
      .stage canvas { display:block; width:100%; height:100%; position:relative; }
      .hud { display:flex; align-items:center; gap:14px; margin:14px 0 18px; }
      .listen { font:inherit; padding:8px 18px; border-radius:8px; cursor:pointer;
                color:var(--text); background:transparent; border:1px solid var(--line); }
      .listen:hover { background:var(--panel); }
      .swatchWrap { margin-left:auto; display:flex; align-items:center; gap:9px; }
      .swatch { width:26px; height:26px; border-radius:7px; border:1px solid var(--line);
                background:#fff; display:inline-block; }
      .hex { font:500 13px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
             min-width:132px; transition:opacity .35s ease, color .35s ease; }
      .hex.is-name { font:500 14px/1 ui-sans-serif, system-ui, sans-serif;
                     letter-spacing:.01em; }
      .panel { background:var(--panel); border:1px solid var(--line); border-radius:12px;
               padding:16px 18px; }
      .presets { display:flex; flex-wrap:wrap; gap:7px; margin-bottom:16px; }
      .preset { font:inherit; font-size:13px; padding:5px 13px; border-radius:7px;
                cursor:pointer; color:var(--text); background:transparent;
                border:1px solid var(--line); }
      .preset:hover { background:#1d242b; }
      .row { display:flex; align-items:center; gap:12px; margin-bottom:9px; }
      .row.is-disabled { opacity:.4; }
      .label { width:96px; flex:none; color:var(--muted); font-size:13px; }
      .row input[type=range] { flex:1; accent-color:#7aa2c8; }
      .readout { width:104px; flex:none; text-align:right;
                 font:500 13px/1 ui-monospace, SFMono-Regular, Menlo, monospace; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
